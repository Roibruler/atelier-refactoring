#Nom du projet, décrit ce que fait le workflow
name: Compilation et tests du projet Maven

#S'exécute à chaque push et chaque Pull Request vers main, ou manuellement
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
          - name: Récupérer le code
            uses: actions/checkout@v5
          - name: Installer le JDK 25
            uses: actions/setup-java@v5
            with:
              distribution: 'temurin'
              java-version: '25'
              cache: maven
          - name: Donner accès en exécution au wrapper
            run: chmod +x mvnw
          - name: Compilation, tests et rapport de couverture JaCoCo
            run: ./mvnw -B clean verify
          - name: Publier le rapport JaCoCo
            if: always()
            uses: actions/upload-artifact@v5
            with:
              name: rapport-jacoco
              path: target/site/jacoco/
          - name: Empaqueter le projet
            run: ./mvnw -B clean package
          - name: Publier le .jar
            uses: actions/upload-artifact@v5
            with:
              name: atelier-refactoring-jar
              path: target/atelier-refactoring.jar